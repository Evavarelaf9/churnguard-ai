name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    name: Machine Learning (lint + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt ruff
      - name: Lint
        run: ruff check ml backend
      - name: Gerar dados sintéticos e base analítica
        run: |
          python -m ml.src.data.generate_synthetic
          python -m ml.src.data.build_analytical_base
      - name: Testes de ML
        run: python -m pytest ml/tests

  api:
    name: API (integração com PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: churnguard
          POSTGRES_PASSWORD: churnguard
          POSTGRES_DB: churnguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U churnguard -d churnguard_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://churnguard:churnguard@localhost:5432/churnguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Gerar dados sintéticos e base analítica
        run: |
          python -m ml.src.data.generate_synthetic
          python -m ml.src.data.build_analytical_base
      - name: Testes da API
        run: python -m pytest backend/tests

  frontend:
    name: Frontend (tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run test
      - run: npm run build

  docker:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: [ml, api, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
